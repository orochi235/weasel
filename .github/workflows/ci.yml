name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Bundle-size visibility for the WebGL transition. Hard delta-vs-baseline
      # gate landed in step 9 (per docs/superpowers/specs/2026-05-08-webgl-transition-plan-design.md).
      # Update packages/weasel-gl/.bundle-size-baseline alongside any large
      # intentional bundle-size change.
      - name: Assert weasel-gl bundle size delta
        run: |
          CURRENT=$(npm run bundlesize:weasel-gl --silent 2>&1 | grep -oE '[0-9]+ bytes' | grep -oE '[0-9]+')
          BASELINE=$(cat packages/weasel-gl/.bundle-size-baseline 2>/dev/null || echo 0)
          DELTA=$((CURRENT - BASELINE))
          echo "Bundle size: ${CURRENT} bytes (baseline: ${BASELINE}, delta: ${DELTA})"
          if [ "$DELTA" -gt 51200 ]; then
            echo "ERROR: bundle grew by ${DELTA} bytes (> 50KB limit)."
            echo "Update packages/weasel-gl/.bundle-size-baseline if this is intentional."
            exit 1
          fi
