name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys
    # (link-workspace-packages). See CLAUDE.md "Package manager".
    env:
      NPM_CONFIG_LOGLEVEL: error
      # Must match release.yml. CI exists to catch what the release would hit,
      # which it cannot do while the two run different npm majors: `npm pack
      # --json` changed from an array to an object keyed by package name in
      # npm 12, and check:manifests broke in Release while CI stayed green.
      # Pinned rather than `@latest` so a new npm major arrives as a commit
      # this job validates, not as a surprise mid-release.
      NPM_VERSION: 12.0.2
    strategy:
      matrix:
        # The floor and the target. 22 is what `engines` promises, so it gets
        # tested rather than assumed; 24 is Active LTS and what the other
        # workflows run. Node 20 is gone — it went EOL 2026-04-30.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # Refuses any changeset bump above `patch` without a sign-off marker.
      # Every published package shares one `fixed` group, so one bump moves them
      # all — which is how 0.8.0 became 1.0.0 by accident on 2026-08-12.
      - run: npm run check:bumps
      # And that the group is still the whole set: it is a hand-written list of
      # names, so a new package omitted from it versions on its own in silence.
      - run: npm run check:lockstep
      # A package importing a module its manifest does not declare builds here,
      # where hoisting resolves it, and ships inlined or unresolvable.
      - run: npm run check:imports
      # A package built before a sibling it depends on gets no types for it.
      # Only a clean install shows that, so the order is read, not built.
      - run: npm run check:build-order
      # A package that has never been published cannot be published by the
      # release job's OIDC token — it needs one manual publish first. Warn
      # here rather than fail: the PR that adds a package is legitimately the
      # one where it does not exist yet. The release job gates on it.
      - run: npm run check:first-publish -- --warn
      # Every kit frame loop runs behind `useVisibleRaf`; a bare
      # requestAnimationFrame is how that stops being true.
      - run: npm run check:frame-loops
      # The audio worklet's processor ships as source text generated from the
      # synth kernels; editing a kernel without regenerating it ships the old one.
      - run: npm run check:audio-worklet
      # No source file or function grows past its cap; the allowlist's entries
      # only come down.
      - run: npm run check:size
      # The README's package marks (React, DOM, WebGL2, Web Audio) match what
      # each main entry's import graph measures. See scripts/package-traits.mjs.
      - run: npm run check:needs
      # Every `var(--wzl-*)` names a theme token or a declared override hook;
      # a read of a name nothing declares drops its declaration silently.
      - run: npm run check:token-reads
      # Numeric text takes its face from @weasel-js/theme/numeric.module.css;
      # tabular-nums written anywhere else aligns nothing in Oswald.
      - run: npm run check:numeric
      # Text on an accent fill redirects muted and subtle to their on-accent pair,
      # or they fall below 4.5:1 there.
      - run: npm run check:on-accent
      # The stylesheet rules docs/conventions.md states: a spacing literal that
      # has a rung, a control height frozen in px, a label restating the
      # panel-label recipe, a z-index off the layer ladder.
      - run: npm run check:spacing
      - run: npm run check:controls
      - run: npm run check:labels
      - run: npm run check:layers
      # Every public export carries a JSDoc block, and none is @internal
      # (docs/conventions.md). The report alone exits 0 whatever it finds.
      - run: npm run audit:jsdoc -- --quiet --check
      - run: npm run typecheck
      # Two things (eslint.config.js). The scoped no-restricted-imports blocks
      # guard one-way dependency arrows — core/ ← features/, and the leaf purity
      # of @weasel-js/font and @weasel-js/audio — whose violation is a
      # bundler-duplicated module, a silent failure tsc can't see. The baseline
      # block catches bugs: stale hook dependencies, conditional hooks, `any` on
      # shipped surface. The config existed unrun until 2026-08-08 and four real
      # violations had accumulated behind it.
      - run: npm run lint
      # labkit carries its own biome config + class-prefix check (its tests run
      # in the `labkit` vitest project below).
      - run: npm run lint -w @weasel-js/labkit
      # A test file no project's include glob reaches is collected by nobody
      # and says nothing about it. Runs before the suite so an orphan surfaces
      # as its own failure rather than as a suspiciously small pass count. It
      # also fails when the vitest steps here leave out a project `npm test` runs.
      - run: npm run check:test-projects
      - run: npm run check:forge-boundary
      - run: npm run check:forge-isolate
      # Every story file indexes without a fault.
      - run: npm run check:forge-stories
      - run: npx vitest run --project=core --project=site --project=weasel-ui --project=draw --project=labkit --project=forge --project=forge-node --project=smoke
      # Tests that need real layout or real IndexedDB (`*.browser.test.*`), in headless Chromium.
      - run: npx playwright install --with-deps chromium-headless-shell
      - run: npm run test:browser
      # Every story mounts, and its `play` checks the layout jsdom cannot see.
      - run: npm run test:stories:forge
      - run: npm run build
      # labkit's declarations are checked against its siblings' built ones, and
      # its stylesheet copies core's and ui's, so it builds after them.
      - run: npm run build -w @weasel-js/labkit
      # The suite above runs before any dist exists, so it skips forge's check
      # that the built plugin resolves its published shims. Rerun that file now;
      # FORGE_BUILT makes a missing dist a failure rather than a skip.
      - run: npx vitest run --project=forge-node packages/forge/src/csf/shims/alias.test.ts
        env:
          FORGE_BUILT: '1'
      # Every path a publishable package advertises in `main`/`module`/`types`/
      # `exports` must actually be in its tarball. See scripts/check-publish-manifests.mjs.
      - run: npm run check:manifests
      # Importing one small symbol from core's built dist must stay small: a
      # dist a consumer's bundler cannot tree-shake ships the whole kit, and
      # every in-repo test resolves source, so nothing else sees it.
      # See scripts/check-treeshake.mjs.
      - run: npm run check:treeshake
      # A subpath that promises no React must have none in its built closure.
      # Only the emitted graph can say so. See scripts/check-react-free.mjs.
      - run: npm run check:react-free
      # Build the two Vite-built packages a SECOND time and re-check. This is the
      # only step that exercises a WARM build, and a warm build is precisely the
      # blind spot that let @weasel-js/ui@0.5.0 and @weasel-js/hud@0.5.0 ship with
      # zero .d.ts while CI stayed green: a cold checkout builds each package once,
      # but `vite build` empties dist, so from the second build onward an
      # incremental tsc would consider the deleted declarations already emitted and
      # skip them — silently, exit 0. Cheap insurance; these two builds are seconds.
      - run: npm run build -w @weasel-js/ui -w @weasel-js/hud
      - run: npm run check:manifests
      # labkit's dist inlines no weasel sibling. Bundle every labkit entry from
      # outside the monorepo + grep dist (js+dts) both ways: every sibling
      # specifier is one the manifest declares, and every declared one IS there.
      # An inlined sibling is the silent failure — it resolves and renders,
      # against a second copy of that package's state. Runs after the build above.
      # See packages/labkit/scripts/smoke-consumer-bundle.mjs.
      - run: npm run test:smoke:consumer -w @weasel-js/labkit
      # `npm pack` every published @weasel-js package, extract them into a tree
      # outside the monorepo, then bundle + typecheck a consumer against it.
      # Proves the cross-package `exports`/`types` maps resolve, that no
      # repo-internal path alias leaked into dist, and that core externalizes
      # (rather than inlines) its siblings — inlining would hand consumers
      # duplicate module instances. The in-repo vitest `smoke` project can't
      # catch any of this; it inherits the repo tsconfig paths.
      # See scripts/smoke-consumer-bundle.mjs.
      - run: npm run test:smoke:consumer
      # The site pages.yml deploys: demos, API docs, draw, forge.
      # Left to pages.yml alone, a break here failed every deploy for three days
      # (an export with no typedoc category) while CI and every release stayed
      # green. One matrix leg is enough — the site is not an engines promise.
      - if: matrix.node == 24
        run: |
          npm run build:demo
          npm run build:draw
          npm run build:forge
