name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys
    # (link-workspace-packages). See CLAUDE.md "Package manager".
    env:
      NPM_CONFIG_LOGLEVEL: error
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
