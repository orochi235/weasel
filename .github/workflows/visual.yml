name: Visual Regression

# Runs on every PR and on pushes to main. This was workflow_dispatch-only while
# the rig produced false negatives — baselines predated the pinned runner and
# `easings` carried a 2.81% diff unrelated to most PRs. Both causes are gone:
# captures now read the canvas backing store rather than screenshotting the
# element, which removed the layout-dependent ±1px drift, and every baseline was
# recaptured on this runner (easings is now 0.003%).
#
# CRITICAL: this workflow is pinned to ubuntu-22.04. Changing the runner
# image will corrupt all baseline PNGs — you must run test:visual:update
# in a matching environment and commit new baselines. See CONTRIBUTING.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A superseded push's run tells us nothing; don't queue behind it.
concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-regression:
    # ⚠️  DO NOT change this runner without regenerating all baselines.
    # See docs/superpowers/specs/2026-05-08-webgl-transition-plan-design.md
    # "Visual regression rig → CI image pinning".
    runs-on: ubuntu-22.04
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys.
    env:
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Install Playwright browsers. The version is pinned by package-lock.json.
      - run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      # On failure, upload the captured PNGs, the pixelmatch diff images, and
      # Playwright's traces. (This used to upload tests/visual/baselines/, which
      # is just the committed baselines — already in git, and no help at all in
      # seeing what changed.)
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-results
          path: |
            test-results/
          retention-days: 14
