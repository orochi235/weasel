name: Visual Regression

# Manual-trigger only for now. Auto-running on every PR/push was producing
# false negatives because (a) baselines haven't been captured against the
# pinned ubuntu-22.04 runner yet, and (b) the existing baseline files have a
# pre-existing 2.81% diff on `easings` that's unrelated to most PRs.
# Switching to workflow_dispatch keeps the rig available without gating
# normal development. To run: GitHub → Actions → Visual Regression → Run.
#
# CRITICAL: this workflow is pinned to ubuntu-22.04. Changing the runner
# image will corrupt all baseline PNGs — you must run test:visual:update
# in a matching environment and commit new baselines. See CONTRIBUTING.md.
on:
  workflow_dispatch:

jobs:
  visual-regression:
    # ⚠️  DO NOT change this runner without regenerating all baselines.
    # See docs/superpowers/specs/2026-05-08-webgl-transition-plan-design.md
    # "Visual regression rig → CI image pinning".
    runs-on: ubuntu-22.04
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys.
    env:
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Install Playwright browsers. The version is pinned by package-lock.json.
      - run: npx playwright install --with-deps chromium

      - name: Run visual regression tests
        run: npm run test:visual

      # On failure, upload diff artifacts so reviewers can inspect what changed.
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-results
          path: |
            tests/visual/baselines/
          retention-days: 14
