name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    # Only redeploy when something user-visible changed. Doc-only commits and
    # repo plumbing (CHANGELOG, .changeset/, etc.) don't need to spin up the
    # demo + Storybook builds.
    paths:
      - 'src/**'
      - 'apps/**'
      - 'demo/**'
      - 'packages/**'
      - '.storybook/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys.
    env:
      NPM_CONFIG_LOGLEVEL: error
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the demo "created / last modified" stamps come from
          # `git log` per file (scripts/vite-demo-timestamps.ts). The default
          # depth-1 clone grafts every file onto HEAD, stamping every demo
          # with the deploy commit's date.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - run: npm run build:draw
      - run: mkdir -p dist-demo/draw && cp -R dist-draw/. dist-demo/draw/
      - run: npm run build-storybook -- -o dist-demo/docs/ui/storybook
      # labkit's VitePress docs (base `/weasel/labkit/`) served under /labkit.
      - run: npm run docs:build -w @weasel-js/labkit
      - run: mkdir -p dist-demo/labkit && cp -R packages/labkit/docs/.vitepress/dist/. dist-demo/labkit/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
