name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/*.md'
      - '.github/workflows/release.yml'
  # The push trigger is path-filtered, so a fix that touches only a package's
  # manifest can't retrigger a publish. Manual dispatch covers that case.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys.
    env:
      NPM_CONFIG_LOGLEVEL: error
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npx changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
