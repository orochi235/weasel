name: Release

on:
  push:
    branches: [main]
    paths:
      - '.changeset/*.md'
      - '.github/workflows/release.yml'
  # The push trigger is path-filtered, so a fix that touches only a package's
  # manifest can't retrigger a publish. Manual dispatch covers that case.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Hide `npm warn Unknown ... config` noise from `.npmrc`'s pnpm-only keys.
    env:
      NPM_CONFIG_LOGLEVEL: error
      # Must match ci.yml, so CI runs the release's own tooling and can fail
      # before a release does. See the note there.
      NPM_VERSION: 12.0.2
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1, and Node 24 only bundles 11.0 —
      # so this stays even on the newer runtime. Without it the publish silently
      # falls back to the classic token path and fails as E404/ENEEDAUTH, which
      # reads like a missing package rather than an out-of-date CLI.
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci
      # Covers all thirteen workspaces, labkit included — it is last in
      # `build:downstream` because it bundles the others.
      - run: npm run build
      # Last gate before anything reaches npm: refuse to publish a package whose
      # `exports`/`types` map promises files the tarball does not contain.
      - run: npm run check:manifests
      # And refuse to *version* on an unapproved bump above patch. CI already
      # checks this on the PR, but the release path accepts
      # `workflow_dispatch`, which bypasses that entirely.
      - run: npm run check:bumps
      # v2 is required by @changesets/cli 3.x: the CLI moved its output to
      # @clack/prompts and no longer prints the `New tag:` lines v1 scraped from
      # stdout to learn what published. v1 against a 3.x CLI publishes to npm
      # and then reports nothing as released.
      # No NPM_TOKEN, and no `env:` at all. npm authentication is OIDC trusted
      # publishing: the job mints a short-lived credential from `id-token: write`
      # above, scoped to this run. Setting NPM_TOKEN/NODE_AUTH_TOKEN here would be
      # actively harmful — npm prefers a token when it finds one, taking the
      # classic path that npm revoked in December 2025 and losing provenance with
      # it. GitHub auth is the `github-token` input, which defaults to
      # `github.token`; v2 dropped the GITHUB_TOKEN environment variable, so
      # setting it again would read as configuration and do nothing.
      - name: Create Release Pull Request or Publish
        uses: changesets/action@v2
        with:
          publish-script: npm run release
          version-script: npx changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
