name: Performance

# Manual and nightly only, never on push. The specs under tests/perf/ assert on
# wall-clock timing under a real GL renderer, and runner variance is larger than
# the regressions worth catching — gating a PR on them would block merges on
# runner weather. Read the run as a trend against previous runs, not as a
# pass/fail on the change.
#
# Runs on the self-hosted M1 Max (`studio`), which has a real Metal GPU. Runs
# before 2026-08-29 used GitHub's runners, which have no GPU and fall back to
# SwiftShader — the trend is discontinuous at that boundary and earlier numbers
# are not comparable. The specs print the unmasked GL renderer, so the log says
# which side of it a run is on.
on:
  workflow_dispatch:
  schedule:
    # 07:00 UTC daily — off the working day for either coast.
    - cron: '0 7 * * *'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf:
    runs-on: [self-hosted, macOS, ARM64, gpu]
    # The runner is a single machine, so a hung job blocks every later run.
    timeout-minutes: 45
    env:
      NPM_CONFIG_LOGLEVEL: error

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # No --with-deps: that installs Linux system packages via apt and fails
      # on macOS.
      - run: npx playwright install chromium

      # caffeinate -d: with the runner's display asleep, the render pipeline
      # stalls for seconds at a time — p95 holds but the mean fails the budget.
      - name: Run performance specs
        run: caffeinate -d -i npm run test:perf

      # The per-command and frame-budget tables are printed, not asserted, so
      # the log is the artifact that matters even on a pass.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: perf-results
          path: test-results/
          retention-days: 14
