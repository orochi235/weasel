<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<text x="40" y="48" font-family="sans-serif" font-size="13" fill="#333">Trim segment: press Y, hover a piece of path (red dash preview), click to delete it.</text>
<text x="40" y="64" font-family="sans-serif" font-size="13" fill="#333">A piece runs between crossings, with other paths or itself.</text>
<text x="40" y="110" font-family="sans-serif" font-size="13" fill="#333">1. A grid: trim the stubs outside</text>
<text x="40" y="126" font-family="sans-serif" font-size="13" fill="#333">the box, then pieces in the middle.</text>
<path d="M 120 160 L 120 400" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 200 160 L 200 400" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 220 L 260 220" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 320 L 260 320" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="110" font-family="sans-serif" font-size="13" fill="#333">2. A circle crossed by a wave:</text>
<text x="440" y="126" font-family="sans-serif" font-size="13" fill="#333">trim arcs on either side of it.</text>
<path d="M 700.00 280.00 C 700.00 335.23 655.23 380.00 600.00 380.00 C 544.77 380.00 500.00 335.23 500.00 280.00 C 500.00 224.77 544.77 180.00 600.00 180.00 C 655.23 180.00 700.00 224.77 700.00 280.00 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 450 280 C 520 160 580 400 650 280 C 700 200 740 260 770 300" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="520" font-family="sans-serif" font-size="13" fill="#333">3. One path crossing itself:</text>
<text x="40" y="536" font-family="sans-serif" font-size="13" fill="#333">trim the small loop away.</text>
<path d="M 60 700 C 160 560 260 560 200 680 C 150 780 120 600 300 640 C 360 650 380 700 360 740" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="520" font-family="sans-serif" font-size="13" fill="#333">4. Reach (6 px): pairs of lines 4, 8, and 14 px</text>
<text x="440" y="536" font-family="sans-serif" font-size="13" fill="#333">apart. Hover between each pair.</text>
<path d="M 450 600 L 770 600" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 450 604 L 770 604" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 450 660 L 770 660" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 450 668 L 770 668" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 450 720 L 770 720" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 450 734 L 770 734" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 610 570 L 610 760" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="860" font-family="sans-serif" font-size="13" fill="#333">5. Overlapping closed shapes: trim down to the outline of their union.</text>
<path d="M 80 890 L 260 890 L 260 1010 L 80 1010 Z" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 180 930 L 360 930 L 360 1030 L 180 1030 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 480 900 L 560 1020 L 400 1020 Z" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 480 1030 L 560 910 L 400 910 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
</svg>
