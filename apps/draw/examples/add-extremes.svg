<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<text x="40" y="48" font-family="sans-serif" font-size="13" fill="#333">Add extremes: Alt+X, or Path strip → More → Add extremes.</text>
<text x="40" y="64" font-family="sans-serif" font-size="13" fill="#333">Double-click a shape to enter path edit first.</text>
<text x="40" y="80" font-family="sans-serif" font-size="13" fill="#333">After a run, the panel at the workspace's lower left picks Turns: both, left/right, or top/bottom.</text>
<text x="40" y="110" font-family="sans-serif" font-size="13" fill="#333">1. Anchors at 45°, none at the extremes.</text>
<text x="40" y="126" font-family="sans-serif" font-size="13" fill="#333">Nothing selected, Alt+X → four new anchors.</text>
<path d="M 263.64 313.64 C 228.49 348.79 171.51 348.79 136.36 313.64 C 101.21 278.49 101.21 221.51 136.36 186.36 C 171.51 151.21 228.49 151.21 263.64 186.36 C 298.79 221.51 298.79 278.49 263.64 313.64 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="110" font-family="sans-serif" font-size="13" fill="#333">2. One-segment curves that bulge past</text>
<text x="440" y="126" font-family="sans-serif" font-size="13" fill="#333">their ends. Alt+X → an anchor per bulge.</text>
<path d="M 450 170 C 660 170 420 330 620 330" fill="none" stroke="#1d4e89" stroke-width="2"/>
<path d="M 450 420 C 510 300 610 540 670 420" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="520" font-family="sans-serif" font-size="13" fill="#333">3. Control: anchors already at the extremes.</text>
<text x="40" y="536" font-family="sans-serif" font-size="13" fill="#333">Add extremes should be disabled.</text>
<path d="M 290.00 660.00 C 290.00 709.71 249.71 750.00 200.00 750.00 C 150.29 750.00 110.00 709.71 110.00 660.00 C 110.00 610.29 150.29 570.00 200.00 570.00 C 249.71 570.00 290.00 610.29 290.00 660.00 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="520" font-family="sans-serif" font-size="13" fill="#333">4. Shift-click two neighboring anchors, Alt+X:</text>
<text x="440" y="536" font-family="sans-serif" font-size="13" fill="#333">only the segment between them changes.</text>
<text x="440" y="552" font-family="sans-serif" font-size="13" fill="#333">One anchor alone: nothing.</text>
<path d="M 450 680 C 465 600 520 600 535 660 C 550 740 605 740 620 660 C 635 580 690 580 705 660 C 720 740 760 740 770 690" fill="none" stroke="#1d4e89" stroke-width="2"/>
</svg>
