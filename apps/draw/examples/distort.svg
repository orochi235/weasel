<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<text x="40" y="48" font-family="sans-serif" font-size="13" fill="#333">Perspective and free distort: select a shape (or several), press F, drag a corner handle.</text>
<text x="40" y="64" font-family="sans-serif" font-size="13" fill="#333">Path strip → Warp Settings switches Free / Perspective. A new distort starts Free.</text>
<text x="40" y="110" font-family="sans-serif" font-size="13" fill="#333">1. A grid of lines in one group: click it, then drag a</text>
<text x="40" y="126" font-family="sans-serif" font-size="13" fill="#333">corner; a group warps as one. Try Perspective too.</text>
<g><path d="M 60 160 L 60 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 85 160 L 85 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 110 160 L 110 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 135 160 L 135 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 160 160 L 160 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 185 160 L 185 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 210 160 L 210 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 235 160 L 235 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 260 160 L 260 360" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 160 L 260 160" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 185 L 260 185" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 210 L 260 210" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 235 L 260 235" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 260 L 260 260" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 285 L 260 285" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 310 L 260 310" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 335 L 260 335" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 360 L 260 360" fill="none" stroke="#1d4e89" stroke-width="2"/></g>
<text x="440" y="110" font-family="sans-serif" font-size="13" fill="#333">2. A circle: Perspective keeps it an ellipse-</text>
<text x="440" y="126" font-family="sans-serif" font-size="13" fill="#333">like curve; Free bends it unevenly.</text>
<path d="M 690.00 260.00 C 690.00 309.71 649.71 350.00 600.00 350.00 C 550.29 350.00 510.00 309.71 510.00 260.00 C 510.00 210.29 550.29 170.00 600.00 170.00 C 649.71 170.00 690.00 210.29 690.00 260.00 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="520" font-family="sans-serif" font-size="13" fill="#333">3. A star: sharp corners under distort,</text>
<text x="40" y="536" font-family="sans-serif" font-size="13" fill="#333">and the refit (tolerance 0.5) on its edges.</text>
<path d="M 200.00 580.00 L 226.45 653.59 L 304.62 656.01 L 242.80 703.91 L 264.66 778.99 L 200.00 735.00 L 135.34 778.99 L 157.20 703.91 L 95.38 656.01 L 173.55 653.59 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="520" font-family="sans-serif" font-size="13" fill="#333">4. Several shapes at once: select all</text>
<text x="440" y="536" font-family="sans-serif" font-size="13" fill="#333">three, then distort them as one.</text>
<path d="M 460 600 L 540 600 L 540 680 L 460 680 Z" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 680.00 640.00 C 680.00 662.09 662.09 680.00 640.00 680.00 C 617.91 680.00 600.00 662.09 600.00 640.00 C 600.00 617.91 617.91 600.00 640.00 600.00 C 662.09 600.00 680.00 617.91 680.00 640.00 Z" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 600.00 710.00 L 611.76 743.82 L 647.55 744.55 L 619.02 766.18 L 629.39 800.45 L 600.00 780.00 L 570.61 800.45 L 580.98 766.18 L 552.45 744.55 L 588.24 743.82 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="860" font-family="sans-serif" font-size="13" fill="#333">5. Text converts to outlines when the drag begins; one undo puts the text back.</text>
<text x="60" y="960" font-family="sans-serif" font-size="72" fill="#1d4e89">Distort</text>
</svg>
