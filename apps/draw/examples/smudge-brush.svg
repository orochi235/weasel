<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056" viewBox="0 0 816 1056">
<text x="40" y="48" font-family="sans-serif" font-size="13" fill="#333">Smudge brush: press S and drag across paths and text. With a selection, only selected ones move.</text>
<text x="40" y="64" font-family="sans-serif" font-size="13" fill="#333">[ and ] resize the brush, Shift+[ and Shift+] change its strength; the row above the canvas shows both.</text>
<text x="40" y="80" font-family="sans-serif" font-size="13" fill="#333">After a stroke, the panel at the bottom left changes its Size and Strength and redoes it; the row above follows.</text>
<text x="40" y="110" font-family="sans-serif" font-size="13" fill="#333">1. A straight line: start on it and</text>
<text x="40" y="126" font-family="sans-serif" font-size="13" fill="#333">drag down to pull a smooth bump.</text>
<path d="M 60 230 L 360 230" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="110" font-family="sans-serif" font-size="13" fill="#333">2. A circle: drag from inside</text>
<text x="440" y="126" font-family="sans-serif" font-size="13" fill="#333">outward to bulge it, inward to dent it.</text>
<path d="M 690.00 260.00 C 690.00 309.71 649.71 350.00 600.00 350.00 C 550.29 350.00 510.00 309.71 510.00 260.00 C 510.00 210.29 550.29 170.00 600.00 170.00 C 649.71 170.00 690.00 210.29 690.00 260.00 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="520" font-family="sans-serif" font-size="13" fill="#333">3. Parallel lines 12 px apart: one drag</text>
<text x="40" y="536" font-family="sans-serif" font-size="13" fill="#333">across them shows how far the brush reaches.</text>
<path d="M 60 600 L 360 600" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 612 L 360 612" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 624 L 360 624" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 636 L 360 636" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 648 L 360 648" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 660 L 360 660" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 672 L 360 672" fill="none" stroke="#1d4e89" stroke-width="2"/><path d="M 60 684 L 360 684" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="520" font-family="sans-serif" font-size="13" fill="#333">4. A small shape under the brush warps by</text>
<text x="440" y="536" font-family="sans-serif" font-size="13" fill="#333">the falloff rather than moving whole.</text>
<path d="M 590 640 L 620 640 L 620 670 L 590 670 Z" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="860" font-family="sans-serif" font-size="13" fill="#333">5. Sparse: one segment. Smudge adds anchors.</text>
<path d="M 60 980 L 360 980" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="440" y="860" font-family="sans-serif" font-size="13" fill="#333">6. Dense: many anchors already. Compare</text>
<text x="440" y="876" font-family="sans-serif" font-size="13" fill="#333">how the two bend under the same drag.</text>
<path d="M 450 980 L 460 988 L 470 972 L 480 988 L 490 972 L 500 988 L 510 972 L 520 988 L 530 972 L 540 988 L 550 972 L 560 988 L 570 972 L 580 988 L 590 972 L 600 988 L 610 972 L 620 988 L 630 972 L 640 988 L 650 972 L 660 988 L 670 972 L 680 988 L 690 972 L 700 988 L 710 972 L 720 988 L 730 972 L 740 988 L 750 972 L 760 988 L 770 972" fill="none" stroke="#1d4e89" stroke-width="2"/>
<text x="40" y="396" font-family="sans-serif" font-size="13" fill="#333">7. Text: the brush converts it to outlines the moment it touches it, then smudges them.</text>
<text x="40" y="412" font-family="sans-serif" font-size="13" fill="#333">One undo puts the text back; Escape mid-stroke leaves it as text.</text>
<text x="60" y="490" font-family="sans-serif" font-size="72" fill="#1d4e89">Smudge me</text>
</svg>
